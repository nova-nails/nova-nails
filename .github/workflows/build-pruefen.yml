# Baut die Seite bei jedem Push auf main und editor genau wie Netlify (npm run build).
# Schlägt der Build fehl, schickt GitHub dem Auslöser eine Mail. Das gilt auch für
# Veröffentlichungen aus dem Editor, weil diese mit dem Token aus PE_GITHUB_TOKEN committen.
# Ersatz für die Netlify-Mail «Deploy failed» (nur im Pro-Plan).
name: Build prüfen

on:
  push:
    branches: [main, editor]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
