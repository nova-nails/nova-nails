# Netlify (Konto der Inhaberin). Keine Secrets hier eintragen.
[build]
  command = "npm run build"
  publish = "dist"
  # Kein Build, wenn sich nur Doku (docs/, *.md) geändert hat (spart Netlify-Credits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs' ':!*.md'"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styleguide"
  [headers.values]
    X-Robots-Tag = "noindex"

# Bearbeiten-Modus (peter-und-co-editor): nie indexieren, nie cachen
[[headers]]
  for = "/bearbeiten"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/bearbeiten.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/pe-version.json"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
